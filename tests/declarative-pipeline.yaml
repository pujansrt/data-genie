version: '1.0'
job:
  name: "Declarative Test Job"
  showProgress: false
pipeline:
  read:
    type: csv
    path: src/examples/input/users.csv
  transform:
    - type: type-convert
      fields: [age]
      to: int
    - type: rename
      mapping:
        fname: firstName
        lname: lastName
    - type: filter
      expression: "age > 30"
    - type: select
      fields: [firstName, lastName, email, age]
  write:
    type: json
    path: tests/output/declarative-output.json
